# Fly app names are globally unique; rename this with `fly apps create <name>`.
app = "albanian-dictionary-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# Run pending migrations before the new version serves traffic, so the schema is
# never behind the code. Idempotent: no-ops when nothing is pending. NOTE: the DB
# must have migration tracking initialized first (`npm run migrate:baseline` once)
# — migrate refuses to run on a populated DB with empty tracking. See DEPLOYMENT.md.
[deploy]
  release_command = "npm run migrate"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
