<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme class before first paint to avoid a flash of the wrong
      // theme (FOUC). Must mirror getTheme() in src/utils/userService.js:
      // a stored choice wins, else system preference, else light.
      (function () {
        try {
          var saved = localStorage.getItem('fjalingo_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage/matchMedia unavailable (privacy mode) → default light.
        }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fjalingo - Mëso shqipen autentike, argëtohu ndërkohë! Kthe fjalët e huazuara në shqipe të pastër." />
    <title>Fjalingo – Mëso shqipen autentike</title>

    <!-- Default social/SEO tags for the base document; react-helmet-async
         overrides these per page once the app mounts. -->
    <meta property="og:title" content="Fjalingo – Fol shqipen e vërtetë, jo fjalë të huazuara" />
    <meta property="og:description" content="Kthe fjalët e huazuara në shqipen e vërtetë — me lojë, jo me mësim." />
    <meta property="og:image" content="https://fjalingo.com/og-default.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fjalingo.com/" />
    <meta property="og:locale" content="sq_AL" />
    <meta property="og:site_name" content="Fjalingo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://fjalingo.com/og-default.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white dark:bg-dark-bg text-body dark:text-dark-text">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
