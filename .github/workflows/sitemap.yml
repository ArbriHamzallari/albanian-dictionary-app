name: Generate sitemap

# Regenerates frontend/public/sitemap.xml from the words table and commits it.
# The commit triggers Vercel's deploy, so the published sitemap is always fresh.
# Requires a DATABASE_URL repo secret (read access to the words table).

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {}

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Generate sitemap
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run generate-sitemap

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- frontend/public/sitemap.xml; then
            git config user.name "fjalingo-bot"
            git config user.email "bot@fjalingo.al"
            git add frontend/public/sitemap.xml
            git commit -m "chore: regenerate sitemap [skip ci]"
            git push
          else
            echo "Sitemap unchanged."
          fi
