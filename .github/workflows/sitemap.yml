name: Generate sitemap

# Regenerates frontend/public/sitemap.xml from the words table and commits it.
# The commit triggers Vercel's deploy, so the published sitemap is always fresh.
# Requires a DATABASE_URL repo secret (read access to the words table). No separate CA
# secret is needed — Supabase's root CA is public and checked into backend/certs/
# (see the "Generate sitemap" step for why that's required at all).

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {}

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches ci.yml (both jobs). Neither package.json declares an `engines`
          # field, so nothing pinned this to 20 — it was simply written before ci.yml
          # standardised on 22, and testing on one version while shipping another is
          # how version-specific breakage gets found in production instead of CI.
          node-version: '22'

      - name: Install backend deps
        working-directory: backend
        run: npm install

      # An unset repo secret expands to an EMPTY STRING, not an error — so without this
      # check the job dies inside node with a raw stack trace from
      # backend/src/utils/db.js, which reads as "the script is broken" rather than "a
      # secret is missing". This workflow failed silently every day from its first run
      # for exactly that reason. Name the real problem instead.
      # NOTE: DATABASE_URL here is a GitHub Actions repo secret — a different store from
      # Fly's secrets. Having it on Fly does not provide it here.
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL repo secret is not set (Settings → Secrets and variables → Actions). This is separate from Fly's secrets. The sitemap job needs read access to the words table."
            exit 1
          fi
          echo "DATABASE_URL is present."

      # SITEMAP-3: Supabase's Postgres cert is signed by Supabase's own self-signed root
      # (subject == issuer, "Supabase Root 2021 CA"), which is not in Node's default
      # trust store — buildSslConfig() in db.js sets rejectUnauthorized: true, so without
      # an explicit CA the handshake fails with "self-signed certificate in certificate
      # chain". This is not a repo-vs-CI blind spot with a missing GitHub secret: the CA
      # is PUBLIC (a root cert has no private key) and is already checked into the repo
      # at backend/certs/prod-ca-2021.crt — the same file the Dockerfile bakes into the
      # Fly image via `COPY backend/ ./`. No new secret is needed; this step just points
      # PGSSLROOTCERT at the copy the runner already checked out.
      #
      # (`fly secrets list -a albanian-dictionary-app` confirms PGSSLROOTCERT is set on
      # Fly, so production points at a file with this same content — but that was
      # confirmed as a name only, never its value. What actually proves this is the
      # right CA: connecting to the real production DATABASE_URL with rejectUnauthorized
      # true and ONLY this checked-in file as the CA succeeds end to end.)
      - name: Generate sitemap
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLROOTCERT: ${{ github.workspace }}/backend/certs/prod-ca-2021.crt
          # Optional: generate-sitemap.js already defaults to https://fjalingo.com,
          # so an unset SITE_URL secret is harmless and not worth failing on.
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run generate-sitemap

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- frontend/public/sitemap.xml; then
            git config user.name "fjalingo-bot"
            git config user.email "bot@fjalingo.com"
            git add frontend/public/sitemap.xml
            git commit -m "chore: regenerate sitemap [skip ci]"
            git push
          else
            echo "Sitemap unchanged."
          fi
